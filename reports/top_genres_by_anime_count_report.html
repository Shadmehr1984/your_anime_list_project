
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Anime List · Top Genres</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ============================================================
           WHITE & TURQUOISE THEME · Light & Clean
           ============================================================ */
        :root {
            --bg-primary: #f2f9fc;
            --bg-glass: rgba(255, 255, 255, 0.75);
            --accent: #00bcd4;
            --accent-dark: #00838f;
            --accent-dim: rgba(0, 188, 212, 0.12);
            --text-main: #1a2a3a;
            --text-secondary: #546e7a;
            --shadow: 0 8px 40px rgba(0, 188, 212, 0.08);
            --radius: 20px;
            --transition: 0.3s ease;
        }

        /* ---------- Reset & Base ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 20px;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(0, 188, 212, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(0, 131, 143, 0.03) 0%, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 1100px;
            width: 100%;
        }

        /* ---------- Glass Card (Light) ---------- */
        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--accent-dim);
            border-radius: var(--radius);
            padding: 28px 30px;
            box-shadow: var(--shadow);
        }

        /* ---------- Header ---------- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-family: 'Bangers', cursive;
            font-size: 34px;
            color: var(--accent-dark);
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 188, 212, 0.10);
        }

        .logo i {
            margin-right: 10px;
            color: var(--accent);
        }

        .header-date {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .header-date i {
            margin-right: 6px;
            color: var(--accent);
        }

        /* ---------- Page Title ---------- */
        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .page-title i {
            color: var(--accent);
            margin-right: 10px;
        }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 30px;
            font-weight: 400;
        }

        /* ---------- Table Styles ---------- */
        .table-wrapper {
            overflow-x: auto;
        }

        .genre-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }

        .genre-table thead th {
            text-align: left;
            padding: 14px 16px;
            font-weight: 700;
            color: var(--accent-dark);
            border-bottom: 2px solid var(--accent-dim);
            font-size: 14px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .genre-table thead th:last-child,
        .genre-table tbody td:last-child {
            text-align: right;
        }

        .genre-table tbody td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(0, 188, 212, 0.04);
            color: var(--text-main);
            transition: background var(--transition);
        }

        .genre-table tbody tr:last-child td {
            border-bottom: none;
        }

        .genre-table tbody tr:hover td {
            background: rgba(0, 188, 212, 0.03);
        }

        .genre-table .rank-col {
            font-weight: 700;
            color: var(--text-secondary);
            width: 60px;
            font-family: 'JetBrains Mono', monospace;
        }

        .genre-table .genre-name {
            font-weight: 600;
            color: var(--text-main);
        }

        .genre-table .count-col {
            font-weight: 700;
            color: var(--accent-dark);
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
        }

        /* ---------- Footer ---------- */
        .footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--accent-dim);
        }

        .footer i {
            color: var(--accent);
            margin: 0 4px;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 640px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .logo { font-size: 28px; }
            .page-title { font-size: 22px; }
            .glass { padding: 20px 16px; }
            .genre-table thead th,
            .genre-table tbody td {
                padding: 10px 12px;
                font-size: 14px;
            }
            .genre-table .count-col {
                font-size: 14px;
            }
        }

        @media (max-width: 400px) {
            .logo { font-size: 24px; }
            .page-title { font-size: 19px; }
            .genre-table thead th,
            .genre-table tbody td {
                padding: 8px 10px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ============================================================
        HEADER
        ============================================================ -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-film"></i>
                Your Anime List
            </div>
            <div class="header-date">
                <i class="fas fa-calendar-alt"></i>
                <span id="currentDate"></span>
            </div>
        </header>

        <!-- ============================================================
        MAIN CONTENT
        ============================================================ -->
        <main>

            <!-- Page Title -->
            <h1 class="page-title">
                <i class="fas fa-tags"></i>
                Top Genres by Anime Count
            </h1>
            <p class="page-subtitle">
                Genres with the highest number of anime
            </p>

            <!-- Table -->
            <div class="glass">
                <div class="table-wrapper">
                    <table class="genre-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Genre Name</th>
                                <th>Anime Count</th>
                            </tr>
                        </thead>
                        <tbody>
                        

<tr>
                                <td class="rank-col">1</td>
                                <td class="genre-name">Action</td>
                                <td class="count-col">230</td>
                            </tr>
                            

<tr>
                                <td class="rank-col">2</td>
                                <td class="genre-name">Drama</td>
                                <td class="count-col">219</td>
                            </tr>
                            

<tr>
                                <td class="rank-col">3</td>
                                <td class="genre-name">Shounen</td>
                                <td class="count-col">146</td>
                            </tr>
                            

<tr>
                                <td class="rank-col">4</td>
                                <td class="genre-name">Fantasy</td>
                                <td class="count-col">143</td>
                            </tr>
                            

<tr>
                                <td class="rank-col">5</td>
                                <td class="genre-name">Romance</td>
                                <td class="count-col">131</td>
                            </tr>
                            

<tr>
                                <td class="rank-col">6</td>
                                <td class="genre-name">School</td>
                                <td class="count-col">126</td>
                            </tr>
                            

<tr>
                                <td class="rank-col">7</td>
                                <td class="genre-name">Sci-Fi</td>
                                <td class="count-col">123</td>
                            </tr>
                            

<tr>
                                <td class="rank-col">8</td>
                                <td class="genre-name">Suspense</td>
                                <td class="count-col">107</td>
                            </tr>
                            

<tr>
                                <td class="rank-col">9</td>
                                <td class="genre-name">Adventure</td>
                                <td class="count-col">105</td>
                            </tr>
                            

<tr>
                                <td class="rank-col">10</td>
                                <td class="genre-name">Seinen</td>
                                <td class="count-col">105</td>
                            </tr>
                            

</tbody>
                    </table>
                </div>
            </div>

        </main>

        <!-- ============================================================
        FOOTER
        ============================================================ -->
        <footer class="footer">
            <i class="fas fa-crown"></i>
            Your Anime List &nbsp;&nbsp; Reports
            <i class="fas fa-crown"></i>
        </footer>

    </div>

    <!-- ============================================================
    SCRIPT: Display today's date
    ============================================================ -->
    <script>
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        document.getElementById('currentDate').textContent = year + '/' + month + '/' + day;
    </script>

</body>
</html>
